<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#06080c"
    />
    <title>DropLink — Fast, Secure Peer-to-Peer File Transfer</title>
    <meta
      name="description"
      content="DropLink is a free, zero-cloud peer-to-peer file transfer tool. Send unlimited large files directly between iPhone, Android, Windows, Mac, and Linux using encrypted WebRTC."
    />
    <meta
      name="keywords"
      content="DropLink, P2P file transfer, WebRTC file share, send large files free, AirDrop alternative for Android, direct peer to peer transfer, zero cloud storage"
    />
    <meta name="author" content="DropLink" />
    <link rel="canonical" href="https://drroplinkxd.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drroplinkxd.com/" />
    <meta property="og:title" content="DropLink — Fast, Secure Peer-to-Peer File Transfer" />
    <meta
      property="og:description"
      content="Transfer files directly between devices without cloud storage. Fast, encrypted, and free WebRTC P2P sharing."
    />
    <meta property="og:image" content="https://drroplinkxd.com/favicon.svg" />
    <meta property="og:site_name" content="DropLink" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DropLink — Fast, Secure Peer-to-Peer File Transfer" />
    <meta
      name="twitter:description"
      content="Send unlimited files directly between devices with zero cloud uploads. Powered by WebRTC and end-to-end encryption."
    />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none';"
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DropLink",
        "url": "https://drroplinkxd.com/",
        "description": "Browser-first peer-to-peer file transfer tool powered by WebRTC.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
